<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNEOSMART5 · Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/60 sticky top-0 backdrop-blur z-10">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-sm">S5</div>
        <span class="font-semibold">SNEOSMART5 Admin</span>
      </div>
      <div class="flex items-center gap-4">
        <span id="adminName" class="text-sm text-slate-400"></span>
        <button id="logoutBtn" class="text-sm bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg">Salir</button>
      </div>
    </div>
  </header>

  <!-- Tabs -->
  <nav class="max-w-6xl mx-auto px-4 pt-4 flex gap-2">
    <button data-tab="usuarios" class="tab-btn px-4 py-2 rounded-lg bg-indigo-600 text-sm font-medium">Usuarios</button>
    <button data-tab="contenido" class="tab-btn px-4 py-2 rounded-lg bg-slate-800 text-sm font-medium">Contenido</button>
    <button data-tab="proveedores" class="tab-btn px-4 py-2 rounded-lg bg-slate-800 text-sm font-medium">Proveedores</button>
  </nav>

  <main class="max-w-6xl mx-auto px-4 py-6">

    <!-- ===== USUARIOS ===== -->
    <section id="tab-usuarios" class="tab-panel space-y-4">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <input id="buscarUsuario" placeholder="Buscar usuario..."
          class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm w-64" />
        <button id="nuevoUsuarioBtn" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-lg text-sm font-medium">
          + Nuevo usuario
        </button>
      </div>

      <div class="overflow-x-auto rounded-xl border border-slate-800">
        <table class="w-full text-sm">
          <thead class="bg-slate-900 text-slate-400">
            <tr>
              <th class="text-left px-4 py-3">Usuario</th>
              <th class="text-left px-4 py-3">Estado</th>
              <th class="text-left px-4 py-3">Vencimiento</th>
              <th class="text-left px-4 py-3">Conexiones</th>
              <th class="text-right px-4 py-3">Acciones</th>
            </tr>
          </thead>
          <tbody id="usuariosTbody" class="divide-y divide-slate-800"></tbody>
        </table>
      </div>
    </section>

    <!-- ===== CONTENIDO ===== -->
    <section id="tab-contenido" class="tab-panel hidden space-y-4">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div class="flex gap-2">
          <input id="buscarContenido" placeholder="Buscar título..."
            class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm w-56" />
          <select id="filtroCategoria" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm">
            <option value="">Todas las categorías</option>
          </select>
        </div>
        <button id="nuevoContenidoBtn" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-lg text-sm font-medium">
          + Nuevo contenido
        </button>
      </div>

      <div class="overflow-x-auto rounded-xl border border-slate-800">
        <table class="w-full text-sm">
          <thead class="bg-slate-900 text-slate-400">
            <tr>
              <th class="text-left px-4 py-3">Título</th>
              <th class="text-left px-4 py-3">Tipo</th>
              <th class="text-left px-4 py-3">Categoría</th>
              <th class="text-left px-4 py-3">Proveedor</th>
              <th class="text-left px-4 py-3">URL</th>
              <th class="text-right px-4 py-3">Acciones</th>
            </tr>
          </thead>
          <tbody id="contenidoTbody" class="divide-y divide-slate-800"></tbody>
        </table>
      </div>
    </section>

    <!-- ===== PROVEEDORES ===== -->
    <section id="tab-proveedores" class="tab-panel hidden space-y-4">
      <div class="flex justify-end">
        <button id="nuevoProveedorBtn" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-lg text-sm font-medium">
          + Nuevo proveedor
        </button>
      </div>

      <div class="overflow-x-auto rounded-xl border border-slate-800">
        <table class="w-full text-sm">
          <thead class="bg-slate-900 text-slate-400">
            <tr>
              <th class="text-left px-4 py-3">Nombre</th>
              <th class="text-left px-4 py-3">Descripción</th>
              <th class="text-left px-4 py-3">Contenidos</th>
              <th class="text-right px-4 py-3">Acciones</th>
            </tr>
          </thead>
          <tbody id="proveedoresTbody" class="divide-y divide-slate-800"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- ===== MODAL genérico ===== -->
  <div id="modalOverlay" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-20">
    <div id="modalBox" class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 space-y-4"></div>
  </div>

  <script src="/js/dashboard.js"></script>
</body>
</html>
